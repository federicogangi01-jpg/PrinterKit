# Controllo notturno dei link del catalogo (§15.2), senza AI.
# 00:07 UTC = 01:07 ora solare italiana / 02:07 ora legale (minuto diverso da :00 per evitare ritardi).
name: controllo-link
on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  issues: write
concurrency: { group: catalogo, cancel-in-progress: false }
jobs:
  controlla:
    runs-on: ubuntu-latest
    outputs:
      cambiati: ${{ steps.c.outputs.cambiati }}
      rotti: ${{ steps.c.outputs.rotti }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: c
        run: python manutenzione/controllo_link.py
      - run: python manutenzione/valida_catalogo.py
      - uses: actions/upload-artifact@v4
        with:
          name: controllo
          path: |
            catalogo/drivers.json
            manutenzione/out/

  firma-windows:
    needs: controlla
    if: needs.controlla.outputs.cambiati != '0'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: controllo }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python manutenzione/scarica_candidati.py manutenzione/out/cambiati.json scaricati-win windows
      - shell: powershell
        run: ./manutenzione/verifica_firma.ps1 -Elenco manutenzione/out/cambiati.json -Cartella scaricati-win
      - uses: actions/upload-artifact@v4
        with:
          name: firma-win
          path: |
            scaricati-win/*.json

  firma-macos:
    needs: controlla
    if: needs.controlla.outputs.cambiati != '0'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: controllo }
      - run: python3 manutenzione/scarica_candidati.py manutenzione/out/cambiati.json scaricati-mac macos
      - run: zsh manutenzione/verifica_firma.sh manutenzione/out/cambiati.json scaricati-mac
      - uses: actions/upload-artifact@v4
        with:
          name: firma-mac
          path: |
            scaricati-mac/*.json

  salva:
    needs: [controlla, firma-windows, firma-macos]
    if: always() && needs.controlla.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: controllo }
      - uses: actions/download-artifact@v4
        with: { name: firma-win, path: scaricati-win }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: firma-mac, path: scaricati-mac }
        continue-on-error: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Aggiorna hash e stato (modifiche meccaniche, salvate direttamente)
        if: needs.controlla.outputs.cambiati != '0'
        run: python manutenzione/applica_risultati.py --cambiati manutenzione/out/cambiati.json scaricati-win scaricati-mac
      - run: |
          python manutenzione/valida_catalogo.py
          python manutenzione/genera_indice_xp.py
      - name: Commit
        run: |
          git config user.name "PrinterKit bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo/drivers.json cache/indice-xp.txt
          git diff --cached --quiet || git commit -m "Controllo link del $(date +%F)"
          git push
      - name: Avviso per le firme non valide
        if: hashFiles('manutenzione/out/issue.md') != ''
        run: |
          if [ -s manutenzione/out/issue.md ]; then
            gh issue create --title "Catalogo: pacchetti cambiati da controllare ($(date +%F))" --body-file manutenzione/out/issue.md
          fi
      - name: Avvia recupero-link se ci sono link rotti
        if: needs.controlla.outputs.rotti != '0'
        run: gh workflow run recupero-link.yml -f modo=rotti
