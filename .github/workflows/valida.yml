# Validazione dello schema a ogni modifica del catalogo o delle ricette.
name: valida
on:
  push:
    paths: ['catalogo/**', 'scanner-ricette/**', 'nas-ricette/**', 'manutenzione/**', 'windows/**', 'tests/**', '.github/workflows/**']
  pull_request:
jobs:
  valida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python manutenzione/valida_catalogo.py
      - run: python -m unittest discover -s tests/python -v
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/pester'; $cfg.Run.PassThru = $true; $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true; $cfg.TestResult.OutputPath = 'pester.xml'
          $r = Invoke-Pester -Configuration $cfg
          # Ogni errore come annotazione, leggibile dalla pagina del workflow senza scaricare i log.
          [xml]$x = Get-Content pester.xml
          foreach ($n in $x.SelectNodes('//test-case[@result="Failure"] | //test-suite[@result="Failure" and failure]')) {
            $m = ("$($n.failure.message) @ $($n.failure.'stack-trace')") -replace "`r?`n", ' | '
            Write-Output ("::error title={0}::{1}" -f $n.name, $m.Substring(0, [math]::Min(900, $m.Length)))
          }
          if ($r.Result -ne 'Passed') { exit 1 }
