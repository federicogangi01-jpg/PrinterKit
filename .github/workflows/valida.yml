# Validazione dello schema a ogni modifica del catalogo o delle ricette.
name: valida
on:
  push:
    paths: ['catalogo/**', 'scanner-ricette/**', 'nas-ricette/**', 'manutenzione/**', 'windows/**', 'tests/**', '.github/workflows/**']
  pull_request:
jobs:
  valida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python manutenzione/valida_catalogo.py
      - run: python -m unittest discover -s tests/python -v
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
          $r = Invoke-Pester -Path tests/pester -PassThru -Output Detailed
          # Ogni errore come annotazione: leggibile dalla pagina del workflow senza scaricare i log.
          foreach ($t in $r.Failed) { Write-Output ("::error title={0}::{1}" -f $t.ExpandedPath, (($t.ErrorRecord | Out-String) -replace "`r?`n", ' | ')) }
          foreach ($c in $r.FailedContainers + $r.FailedBlocks) { Write-Output ("::error title={0}::{1}" -f $c.Name, (($c.ErrorRecord | Out-String) -replace "`r?`n", ' | ')) }
          if ($r.FailedCount -gt 0 -or $r.FailedBlocksCount -gt 0 -or $r.FailedContainersCount -gt 0) { exit 1 }
