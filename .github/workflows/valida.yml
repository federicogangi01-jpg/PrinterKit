# Validazione dello schema a ogni modifica del catalogo o delle ricette.
name: valida
on:
  push:
    paths: ['catalogo/**', 'scanner-ricette/**', 'nas-ricette/**', 'manutenzione/**']
  pull_request:
jobs:
  valida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python manutenzione/valida_catalogo.py
      - run: python -m unittest discover -s tests/python -v
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
          Invoke-Pester -Path tests/pester -CI
